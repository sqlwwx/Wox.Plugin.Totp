# 打 tag → 校验 tag 与 plugin.json Version 一致 → 构建 → 上传 Wox.Plugin.Totp.wox 到 GitHub Release
# 资产名固定 Wox.Plugin.Totp.wox，商店 DownloadUrl 用 releases/latest/download/Wox.Plugin.Totp.wox（不带版本号）
# Wox 商店 CI 定期抓 Website 仓库 /releases/latest 的版本号自动更新 store-plugin.json，
# 所以 tag（即 release 版本）必须始终等于 plugin.json 的 Version
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Check tag matches plugin.json Version
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("plugin.json").text()).Version)')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag != plugin.json Version $version — 先更新 plugin.json 再打 tag"
            exit 1
          fi

      - name: Build and package
        run: |
          bun install --frozen-lockfile
          make test
          make package

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Wox.Plugin.Totp.wox
